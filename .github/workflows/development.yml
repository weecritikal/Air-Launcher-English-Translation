name: Development build

on:
  pull_request:
    branches-ignore:
      - 'l10n_main'
    types: [opened, reopened, synchronize]
  push:
    branches-ignore:
      - 'l10n_main'
  workflow_dispatch:

# Concurrency control: a new push to the same branch/PR cancels older builds that are still queued or running.
# This markedly reduces the "stuck in the queue forever" problem caused by macos-14 runner scarcity:
# during frequent development pushes the old builds are cancelled immediately and the runner capacity goes to the newest commit.
# Manual workflow_dispatch runs join the same group, so automatic and manual triggers do not pile up on each other.
concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Development build
    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios

    runs-on: macos-14

    steps:
      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version || true

      - name: Install GNU Make
        run: |
          brew update
          brew install make

      - name: Install Java 8 (Temurin) via Homebrew
        run: |
          brew install --cask temurin@8 || true

      - name: Install ldid
        run: |
          brew install ldid || true

      - name: Remove work folders
        run: |
          echo "before"
          ls -lah ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          echo "after"
          ls -lah ./

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove stale MobileGL gitlink
        # The MobileGL submodule has been removed completely (there is no matching entry in .gitmodules),
        # but parallel agent operations or a stale local index can reintroduce an orphaned gitlink,
        # making a later git submodule update --init exit 128 because it cannot find the URL.
        # It is therefore force-cleaned after checkout and before submodule initialization.
        # The MobileGlues submodule has likewise been removed (its source is embedded in the repository directly, aligned with Ynnyny).
        run: |
          git rm --cached -f Natives/external/MobileGL 2>/dev/null || true
          git config --remove-section submodule.Natives/external/MobileGL 2>/dev/null || true
          git rm --cached -f Natives/external/MobileGlues 2>/dev/null || true
          git config --remove-section submodule.Natives/external/MobileGlues 2>/dev/null || true

      - name: Checkout repository submodules
        env:
          # MobileGL upstream has exhausted its LFS quota, and its LFS files (tools/trace_replay/fixtures)
          # are irrelevant to the iOS build, so smudge is skipped to keep submodule checkout from failing with exit 128
          GIT_LFS_SKIP_SMUDGE: "1"
        run: git submodule update --init --recursive

      - name: Set up Apple code signing
        # Optional. Runs only when the signing secrets exist; without them the build
        # falls back to ldid, exactly as before. Proper signing is what keeps the
        # increased-memory-limit / extended-virtual-addressing entitlements alive -
        # re-signing with a profile that does not authorise them strips them out, which
        # is why sideloaded builds cannot map a large heap.
        id: signing
        env:
          CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$CERT_P12_BASE64" ] || [ -z "$PROFILE_BASE64" ]; then
            echo "signing=no" >> "$GITHUB_OUTPUT"
            echo "No signing secrets set - building unsigned (ldid)."
            exit 0
          fi
          RUNNER_KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_KEYCHAIN"
          security set-keychain-settings -lut 3600 "$RUNNER_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$RUNNER_KEYCHAIN" login.keychain-db
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_KEYCHAIN" \
            | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "::error::No codesigning identity found in the imported .p12"
            exit 1
          fi
          echo "Signing identity: $IDENTITY"
          rm -f "$RUNNER_TEMP/cert.p12"
          {
            echo "signing=yes"
            echo "identity=$IDENTITY"
            echo "profile=$RUNNER_TEMP/profile.mobileprovision"
          } >> "$GITHUB_OUTPUT"

      - name: Check CurseForge key wiring
        env:
          CONFIG_CURSEFORGE_API_KEY: ${{ secrets.CONFIG_CURSEFORGE_API_KEY }}
        run: |
          # Reports presence and length only - never the value itself.
          if [ -n "$CONFIG_CURSEFORGE_API_KEY" ]; then
            echo "CurseForge API key: present (${#CONFIG_CURSEFORGE_API_KEY} chars), will be compiled in"
          else
            echo "::warning::CurseForge API key not set - CurseForge will be unavailable in this build"
          fi

      - name: Build for ${{ matrix.platform_name }}
        env:
          IPHONEOS_DEPLOYMENT_TARGET: 14.0
          CONFIG_CURSEFORGE_API_KEY: ${{ secrets.CONFIG_CURSEFORGE_API_KEY }}
          # The Makefile declares TEAMID/SIGNING_TEAMID/PROVISIONING with ?=, so values
          # inherited from the environment win. Passing them here rather than on the
          # command line keeps the signing identity intact - it contains spaces and
          # would word-split as a make argument.
          SIGN_ENABLED: ${{ steps.signing.outputs.signing }}
          TEAMID: ${{ secrets.SIGNING_TEAMID }}
          SIGNING_TEAMID: ${{ steps.signing.outputs.identity }}
          PROVISIONING: ${{ steps.signing.outputs.profile }}
          # Optional. Set the BUNDLE_ID repository variable to a bundle id registered
          # under your own team; leaving it unset keeps the upstream default.
          BUNDLE_ID: ${{ vars.BUNDLE_ID }}
        run: |
          set -o pipefail
          export PATH=/opt/homebrew/bin:$PATH
          export SLIMMED=0

          if [ "$SIGN_ENABLED" = "yes" ]; then
            echo "Codesigning enabled for team $TEAMID"
          else
            # Clear the placeholders so the Makefile takes its unsigned ldid path.
            unset TEAMID SIGNING_TEAMID PROVISIONING
          fi
          # An empty BUNDLE_ID would override the Makefile default with a blank value.
          if [ -z "$BUNDLE_ID" ]; then
            unset BUNDLE_ID
          else
            echo "Bundle identifier: $BUNDLE_ID"
          fi

          if [ "${{ matrix.platform_name }}" == "ios" ]; then
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }}

            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1

          elif [ "${{ matrix.platform_name }}" == "tvos" ]; then
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1

          else
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }}
          fi

      - name: Confirm key was compiled in
        if: success()
        run: |
          # Presence check only. Never print config.h - it contains the key.
          if grep -q '^#define CONFIG_CURSEFORGE_API_KEY "' Natives/config.h 2>/dev/null; then
            echo "config.h: CurseForge key compiled in"
          else
            echo "::warning::config.h: no CurseForge key compiled in (app will fall back to a runtime key)"
          fi

      - name: Rename build output
        # The Makefile emits <bundle-id>-<ver>-<platform>.ipa. Rename to short,
        # readable names so the downloaded file is self-explanatory.
        if: success()
        run: |
          cd artifacts
          shopt -s nullglob
          # Bundle-id agnostic, but never pick up the SLIMMED build.
          ipa=( )
          for f in *-${{ matrix.platform_name }}.ipa; do case "$f" in *.slimmed-*) ;; *) ipa+=( "$f" );; esac; done
          tipa=( )
          for f in *-${{ matrix.platform_name }}-trollstore.tipa; do case "$f" in *.slimmed-*) ;; *) tipa+=( "$f" );; esac; done
          if [ ${#ipa[@]} -gt 0 ]; then mv "${ipa[0]}" air-english.ipa; fi
          if [ ${#tipa[@]} -gt 0 ]; then mv "${tipa[0]}" air-english.tipa; fi
          if [ ! -f air-english.ipa ] && [ ! -f air-english.tipa ]; then
            echo "::error::no installable package was produced"; exit 1
          fi
          ls -lh

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: air-launcher-${{ matrix.platform_name }}-english
          path: artifacts/air-english.ipa

      - name: Upload TrollStore tipa
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: air-launcher-${{ matrix.platform_name }}-english-trollstore
          path: artifacts/air-english.tipa

      - name: Upload debug symbols
        if: matrix.platform_name == 'ios' && success()
        uses: actions/upload-artifact@v4
        with:
          name: air-launcher-${{ matrix.platform_name }}-english-dsym
          path: artifacts/AngelAuraAmethyst.dSYM
